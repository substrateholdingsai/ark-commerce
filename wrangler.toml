name = "temozonia"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ✅ NUEVA CONFIGURACIÓN DE ASSETS (Reemplaza la antigua [site])
[assets]
directory = "./dist"
not_found_handling = "single-page-application" # Sirve index.html si la ruta no es un archivo estático

[vars]
SITE_NAME = "Temozonia Carnes Ahumadas"
# URL actual del sitio desplegado en Workers
SITE_URL = "https://temozonia.substrateholdingsai.workers.dev/"
WHATSAPP_NUMBER = "529994918221"
BTCPAY_POS_URL = "https://btcpay.temozonia.com"
CLABE = "123456789012345678"
BANK = "BBVA"
CLABE_HOLDER = "Temozonia Carnes Ahumadas"
SATS_RATE = "2.5"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "temozonia-db"
database_id = "dff6d6dc-fa6c-4ec8-9180-d88d4912a9e7"

# KV Namespaces
[[kv_namespaces]]
binding = "SESSION"
id = "316c37d5fe864e4bab912a0dbbe6b00a"

[[kv_namespaces]]
binding = "CACHE"
id = "90269c9d7ede4252b21463bf9834f64d"

# R2 Bucket
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "temozonia-storage"

# Queues
[[queues.producers]]
binding = "ORDER_QUEUE"
queue = "temozonia-orders"
