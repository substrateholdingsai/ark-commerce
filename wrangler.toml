name = "temozonia"
main = "worker/index.ts"
compatibility_date = "2024-10-09"
compatibility_flags = [ "nodejs_compat" ]

[build]
command = "npm run astro:build"

[assets]
binding = "ASSETS"
directory = "dist"

# ── Recursos activos ──────────────────────────────────────────────────────────

[[d1_databases]]
binding = "DB"
database_name = "ark-fiscal-db"
database_id = "9f7f2e3c-030c-47b0-974f-d4d70fd44296"

# KV para sesiones — creado automáticamente por @astrojs/cloudflare
[[kv_namespaces]]
binding = "SESSION"
id = "316c37d5fe864e4bab912a0dbbe6b00a"
preview_id = "b93b8db2fc3e4cfeabc0e494db14ee2e"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
ASTRO_SITE_URL = "https://temozonia.example.com"

# ── Recursos pendientes de crear ──────────────────────────────────────────────
# Descomenta cuando crees estos recursos en el dashboard de Cloudflare

