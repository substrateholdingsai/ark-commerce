name = "ark-commerce"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Assets estáticos (Astro dist)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Custom domain (subdominio de tiendas)
[[routes]]
pattern = "tiendas.arksystems.site/*"
zone_name = "arksystems.site"
[vars]
SITE_NAME = "Ark Systems"
SITE_URL = "https://ark-commerce.substrateholdingsai.workers.dev/"
WHATSAPP_NUMBER = "529994918221"
BTCPAY_POS_URL = "https://btcpay.arksystems.ai"
CLABE = "012180012345678901"
BANK = "BBVA"
CLABE_HOLDER = "Ark Systems"
SATS_RATE = "2.5"
WHATSAPP_VERIFY_TOKEN = "ark_commerce_wa_secret_2026"
ARKANGEL_ADMIN_TOKEN = "arkangel_internal_service"
ARKANGEL_URL = "https://arkangel.arksystems.site"

# D1 Database Multi-Tenant
[[d1_databases]]
binding = "DB"
database_name = "ark-commerce-db"
database_id = "874b300a-18f6-4995-a98e-27abd7264662"

# KV Namespaces
[[kv_namespaces]]
binding = "SESSION"
id = "316c37d5fe864e4bab912a0dbbe6b00a"

[[kv_namespaces]]
binding = "CACHE"
id = "90269c9d7ede4252b21463bf9834f64d"

# R2 Bucket
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "ark-commerce-storage"

# Queues
[[queues.producers]]
binding = "ORDER_QUEUE"
queue = "ark-commerce-orders"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Service binding Arkangel
[[services]]
binding = "ARKANGEL"
service = "arkangel-cobranza"
